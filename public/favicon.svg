<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
  </defs>
  <!-- Background rounded plate -->
  <rect width="64" height="64" rx="16" fill="url(#brandGrad)" />
  
  <!-- Smartphone outline in clean white -->
  <rect x="18" y="11" width="28" height="42" rx="6" stroke="#FFFFFF" stroke-width="2.5" />
  
  <!-- Notch -->
  <line x1="28" y1="16" x2="36" y2="16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  
  <!-- Minimalist 'M' mark -->
  <path d="M24 35 L24 23 L32 30 L40 23 L40 35" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Home indicator line -->
  <line x1="29" y1="48" x2="35" y2="48" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
</svg>
